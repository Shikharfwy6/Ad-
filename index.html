<body class="bg-slate-950 text-white flex flex-col items-center justify-between min-h-screen p-4 font-sans">

    <!-- Top Banner Ad Space / Direct Link Wrapper -->
    <div class="w-full max-w-xl bg-slate-900 p-4 rounded-xl border border-slate-800 text-center text-slate-400 my-2 shadow-lg">
        <p class="text-xs mb-1">Sponsored Advertisement</p>
        <a href="https://uplcm.com/4/11997836" target="_blank" class="text-indigo-400 font-bold text-sm underline hover:text-indigo-300">Click here to unlock fast speed! 🚀</a>
    </div>

    <!-- Dynamic App Container -->
    <div id="app" class="w-full flex flex-col items-center justify-center my-auto">
        <!-- Content will be rendered dynamically via JavaScript -->
    </div>

    <!-- Bottom Banner Ad Space -->
    <div class="w-full max-w-xl bg-slate-900 p-4 rounded-xl border border-slate-800 text-center text-slate-500 my-2">
        <p class="text-xs">Advertisement Banner Area</p>
    </div>

    <script>
        // Direct Link URL Variable
        const DIRECT_LINK = "https://uplcm.com/4/11997836";

        // Telegram Bot ka base URL jise copy box me banana hai
        const BOT_BASE_URL = "https://t.me/Course_give_bot?start="; 

        // Random Alphanumeric Token Generator Function (jaise aksjjwi, Qoiwueh18)
        function generateRandomToken(length = 10) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // --- ROUTER & APP LOGIC ---
        async function render() {
            let hash = window.location.hash; 
            const app = document.getElementById('app');

            // Agar hash khali hai ya sirf '#' hai, toh naya random token generate karo aur MongoDB me save karne ke liye backend ko bhejo
            if (!hash || hash === '#') {
                const randomStr = generateRandomToken(10); // Jaise aksjjwi ya Qoiwueh18
                
                // Backend API par token save karne ki request bhejo
                try {
                    await fetch('/api/save-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tokan: randomStr })
                    });
                } catch (err) {
                    console.error("Token save karne me error aayi:", err);
                }

                localStorage.setItem('continue_clicks', '0');
                window.location.hash = `token=${randomStr}&step=1`;
                return;
            }

            // PARSE HASH & STEPS LOGIC
            const params = new URLSearchParams(hash.replace('#', ''));
            const token = params.get('token') || generateRandomToken(10);
            let step = parseInt(params.get('step')) || 1;

            // Final Link generate karo copy box ke liye
            const finalLinkToCopy = BOT_BASE_URL + token;

            // Step 4 ke baad Completion / Copy Box Screen dikhao
            if (step > 4) {
                app.innerHTML = `
                    <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-md text-center">
                        <div class="text-emerald-400 text-4xl mb-3">✅</div>
                        <h2 class="text-2xl font-bold mb-2 text-indigo-400">Verification Complete!</h2>
                        <p class="text-slate-400 text-sm mb-6">Aapka link taiyar hai. Niche diye gaye box se copy karein:</p>

                        <div class="space-y-4">
                            <input type="text" id="copy-input" value="${finalLinkToCopy}" readonly class="w-full p-3 rounded-lg bg-slate-800 border border-slate-700 text-emerald-400 font-mono text-sm text-center focus:outline-none">
                            <button id="copy-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg font-bold transition shadow-lg">Copy Link</button>
                        </div>
                    </div>
                `;

                document.getElementById('copy-btn').addEventListener('click', () => {
                    const copyInput = document.getElementById('copy-input');
                    copyInput.select();
                    copyInput.setSelectionRange(0, 99999); 
                    navigator.clipboard.writeText(copyInput.value);

                    const btn = document.getElementById('copy-btn');
                    btn.innerText = "Copied! 👍";
                    btn.classList.remove('bg-indigo-600');
                    btn.classList.add('bg-emerald-600');

                    setTimeout(() => {
                        btn.innerText = "Copy Link";
                        btn.classList.remove('bg-emerald-600');
                        btn.classList.add('bg-indigo-600');
                    }, 2000);
                });
                return;
            }

            let nextStep = step + 1;

            // AD / TIMER STEP PAGES (1 se 4 tak)
            app.innerHTML = `
                <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800 w-full max-w-md text-center">
                    <h2 class="text-xl font-bold mb-2 text-indigo-400">Processing Verification...</h2>
                    <p class="text-slate-400 text-sm mb-6">Step <span id="step-num">${step}</span> of 4</p>

                    <div id="timer-box" class="mb-6">
                        <p class="text-lg font-semibold text-yellow-400">Please wait <span id="countdown">7</span> seconds...</p>
                        <p class="text-xs text-slate-400 mt-2">💡 <a href="${DIRECT_LINK}" target="_blank" class="text-indigo-400 underline font-medium">Click here if timer is slow</a></p>
                    </div>

                    <button id="next-btn" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-bold transition block shadow-lg cursor-pointer">Get Link / Continue</button>
                </div>
            `;

            // Timer Logic
            let timeLeft = 7;
            const countdownEl = document.getElementById('countdown');
            const timerBox = document.getElementById('timer-box');
            const nextBtn = document.getElementById('next-btn');

            const timer = setInterval(() => {
                timeLeft--;
                if (countdownEl) countdownEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (timerBox) timerBox.style.display = 'none';
                    if (nextBtn) nextBtn.classList.remove('hidden');
                }
            }, 1000);

            // --- 5 CLICKS DIRECT LINK LOGIC ---
            if (nextBtn) {
                nextBtn.addEventListener('click', (e) => {
                    e.preventDefault();

                    let clicks = parseInt(localStorage.getItem('continue_clicks') || '0');
                    clicks++;

                    if (clicks < 6) {
                        localStorage.setItem('continue_clicks', clicks.toString());
                        window.open(DIRECT_LINK, '_blank');
                    } else {
                        localStorage.setItem('continue_clicks', '0');
                        window.location.hash = `token=${token}&step=${nextStep}`;
                    }
                });
            }
        }

        window.addEventListener('hashchange', render);
        window.addEventListener('load', render);
    </script>
</body>
</html>
